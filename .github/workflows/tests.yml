# The six self-tests had exactly one execution path — install.sh, run by hand.
# This is the second one, and the only one nobody has to remember.
#
# --strict because a CI runner has no Claude Code sandbox and no leftover scratch
# directory: every test is expected to run here, so BLOCKED/SKIP is a signal, not
# a tolerable condition. install.sh deliberately does NOT pass --strict — an
# install has no business failing because a sandbox denied a directory removal.
#
# node and python3 (a6-selftest.mjs, rule-inventory.py) are preinstalled on
# ubuntu-latest; no setup steps needed.
name: tests

on: [push, pull_request]

jobs:
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh skills/babel/tests/run-all.sh --strict

      # --strict is the whole reason this job catches a test that stops running, so
      # something has to check that --strict itself still works. Hide node, which
      # makes a6-selftest report SKIP, and assert the two exits differ: --strict must
      # fail, a plain run must not. Asserting only the failure would still pass if
      # run-all.sh started failing for any other reason.
      - name: strict mode must fail a run that skipped a test
        run: |
          set -e
          NODE_DIR=$(dirname "$(command -v node)")
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vFx "$NODE_DIR" | paste -sd: -)
          export PATH
          command -v node && { echo "node still on PATH — this check proves nothing"; exit 1; }
          if sh skills/babel/tests/run-all.sh --strict >/dev/null 2>&1; then
            echo "BUG: --strict exited 0 with a test that did not run"; exit 1
          fi
          sh skills/babel/tests/run-all.sh >/dev/null 2>&1 || { echo "BUG: the same run failed without --strict"; exit 1; }
          echo "ok: --strict fails a skipped test, a plain run does not"
